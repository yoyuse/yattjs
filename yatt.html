<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>yatt.js</title>

    <style>
     body { font-size: 0.8rem; }
     #container {
       margin-left: auto;
       margin-right: auto;
       max-width: 800px;
     }
     /*  */
     header {
       border-bottom: 2px solid #424242;
       font-size: 1.0rem;
       margin: 1.33rem 0;
       position: relative;
     }
     h1 {
       display: inline-block;
       font-family: "Meiryo", "Optima", sans-serif;
       font-size: 2.0rem;
       margin: 0;
     }
     /*  */
     #breadcrumb {
       display: inline-block;
       position: absolute;
       right: 0; bottom: 4px;
     }
     #breadcrumb .path-separator { display: none; }
     #breadcrumb .path-component:not(:last-child)::after {
       content: "";
       display: inline-block;
       border: 2px solid #9E9E9E;
       border-bottom: transparent;
       border-left: transparent;
       margin: 8px;
       transform: translate(-2px, 6px) rotate(45deg);
       width: 5px; height: 5px;
     }
     /*  */
     select {
       margin: 4px 0;
       max-width: 14.0rem;
       text-overflow: ellipsis;
     }
     .stdio {
       border: 1px solid #757575;
       border-radius: 2px;
       box-sizing: border-box;
       display: inline-block;
       font-family: monospace;
       font-size: 14px;
       line-height: 120%;
       margin: 4px 0;
       padding: 4px 2px;
       white-space: pre;
       width: 100%;
       /* overflow-wrap: break-word; */
       /* 禁則処理しない */
       /* line-break: anywhere; */
       /* word-break: break-all; */
     }
     #stdin {
       caret-color: FieldText;
       color: Field;
     }
     #stdin::placeholder { color: #757575; }
     #stdhelp {
       white-space: break-spaces;
     }
     /*  */
     span.help {
       padding: 0 4px;
       white-space: pre;
     }
     span.ch {
       font-family: monospace;
       font-size: 13px;
       position: relative;
       bottom: 0.4em;
     }
     span.stroke {
       font-family: monospace;
       font-size: 16px;
       padding: 0 2px;
     }
     span.dothelp {
       display: inline-block;
       margin-bottom: 4px;
     }
     span.dothelp span.ch {
       bottom: 24px;
       display: inline-block;
       font-size: 16px;
     }
     span.dothelp span.stroke {
       display: inline-block;
       margin: 0 2px;
     }
     span.stroke { background-color: #F5F5F5; }
     span.stroke.outset { background-color: #FFCDD2; }
     /* */
     span.accesskey { text-decoration: underline; }
     /* */
     span.usr { color: #26A69A; }
     span.err { color: #F06292; }
     span.weak { border-bottom: 2px solid #F8BBD0; }
     .message {
       border-left: 4px solid #9E9E9E;
       color: #9E9E9E;
       margin-left: 2px;
       padding-left: 8px;
     }
     a:link, a:visited { color: #1E88E5; }
    </style>

    <link href="dark-mode.css" rel="stylesheet">

    <!--  -->
    <script src="lcs.js"></script>
    <script src="cookie.js"></script>
    <script src="utils.js"></script>
    <!--  -->
    <script src="yatt/im.js"></script>
    <script src="yatt/t.js"></script>
    <script src="yatt/tut.js"></script>
    <script src="yatt/try.js"></script>
    <script src="yatt/tt.js"></script>
    <!--  -->
    <script src="yatt/charset.js"></script>
    <script src="yatt/charset-empty.js"></script>
    <script src="yatt/charset-t.js"></script>
    <script src="yatt/charset-tut-2st.js"></script>
    <script src="yatt/charset-tut-3st.js"></script>
    <script src="yatt/charset-kyouiku.js"></script>
    <script src="yatt/charset-jouyou.js"></script>
    <!--  -->
    <script src="yatt/words.js"></script>
    <script src="yatt/words-pubdic+.js"></script>
    <!--  -->
    <script src="yatt/dothelp.js"></script>
    <!--  -->
    <script src="yatt.js"></script>

  </head>
  <body>
    <div id="container">
      <header>
        <h1>yatt.js</h1>
        <!--  -->
        <div id="breadcrumb"></div>
        <script src="breadcrumb.js"></script>
      </header>

      <label for="selectim" title="入力方式を指定します">入力方式(<span class="accesskey">I</span>)</label>
      <select id="selectim" name="selectim" accesskey="i"></select>
      &ensp;
      <input name="checkdothelp" type="checkbox" id="checkdothelp" accesskey="y">
      <label for="checkdothelp" title="コードを(英字表示ではなく)図示します">
        打鍵図(<span class="accesskey">Y</span>)
      </label>
      &ensp;
      <input name="checkecho" type="checkbox" id="checkecho" accesskey="e">
      <label for="checkecho" title="入力キーを表示します">
        エコー(<span class="accesskey">E</span>)
      </label>
      <br>
      <label for="selectcertain" title="CERTAIN: 完全に覚えた(練習の必要がない)文字を指定します">修得済み(<span class="accesskey">V</span>)</label>
      <select id="selectcertain" name="selectcertain" accesskey="v"></select>
      &ensp;
      <input name="checkkana" type="checkbox" id="checkkana" accesskey="g">
      <label for="checkkana" title="CERTAIN(修得済み) にひらがな・かたかな・『ー』『々』の 171 字を含めます">
        かなを含む(<span class="accesskey">G</span>)
      </label>
      <br>
      <label for="selectuncertain" title="UNCERTAIN: 練習する文字を指定します">練習文字(<span class="accesskey">U</span>)</label>
      <select id="selectuncertain" name="selectuncertain" accesskey="u"></select>
      <br>
      <label for="selectlesson" title="レッスン番号を指定します">レッスン(<span class="accesskey">S</span>)</label>
      <select id="selectlesson" name="selectlesson" accesskey="s"></select>
      &ensp;
      <input name="checkrepeat" type="checkbox" id="checkrepeat" accesskey="t">
      <label for="checkrepeat" title="「ミスしたら次の行に進めない」モードです">
        鬼軍曹(<span class="accesskey">T</span>)
      </label>
      <br>
      <div id="stdout" class="stdio" title="出力欄: 問題文や採点結果が表示されます">&nbsp;</div>
      <br>
      <input name="stdin" type="text" value="" id="stdin" class="stdio" lang="en" spellcheck="false" autocomplete="off" placeholder="ここに入力" title="入力欄: ここに入力します" accesskey="j">
      <br>
      <div id="stdhelp" class="stdio" title="ヘルプ欄: コードを表示します">&nbsp;</div>
      <div>
        <button name="buttonhint" id="buttonhint" accesskey="h" title="コードを表示します">
          <span class="accesskey">H</span>int
        </button>
      </div>
    </div>
  </body>
</html>
